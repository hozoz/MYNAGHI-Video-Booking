<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Sales Call — MY NAGHI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6F0E2;
    --card:#FFFFFF;
    --ink:#26263E;
    --muted:#8A8CA3;
    --line:#E8E8EE;
    --purple:#8B5CF6;
    --purple-soft:#F1EBFE;
    --black:#1B1B1F;
    --gray-pill:#EDEDF1;
    --bad:#C4322E;
    --orange:#F97316;
    --footer:#F3F3F6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
    background:#EFEFF2; color:var(--ink);
    min-height:100vh; display:flex; justify-content:center; align-items:flex-start;
    padding:28px 14px;
  }
  html[dir="rtl"] body{font-family:'IBM Plex Sans Arabic','Plus Jakarta Sans',system-ui,sans-serif}
  html[dir="rtl"] .sub, html[dir="rtl"] label, html[dir="rtl"] .date .dw{letter-spacing:0}
  .card{
    background:var(--card); border-radius:24px; width:100%; max-width:560px;
    overflow:hidden; box-shadow:0 8px 40px rgba(38,38,62,.10);
    display:flex; flex-direction:column;
  }
  /* ---------- cream header ---------- */
  .head{background:var(--cream); padding:24px 26px 20px; min-height:186px; display:flex; flex-direction:column; justify-content:flex-start}
  .head .top{display:flex; justify-content:flex-end; align-items:center; margin-bottom:14px; min-height:10px}
  .head h1{font-size:1.62rem; font-weight:800; letter-spacing:-.01em; margin-bottom:8px; min-height:1.3em}
  .head .sub{font-size:1rem; color:var(--muted); letter-spacing:.02em; min-height:1.5em}
  .headrow{display:flex; justify-content:space-between; align-items:center; margin-top:16px}
  .langs{display:flex; gap:8px}
  .lang{
    font-family:inherit; cursor:pointer; border:none; border-radius:14px;
    padding:12px 20px; font-size:.95rem; font-weight:600;
    background:var(--gray-pill); color:var(--ink); transition:background .15s,color .15s;
  }
  .lang.on{background:var(--black); color:#fff}
  .lang[data-l="ar"]{font-family:'IBM Plex Sans Arabic',sans-serif}
  .dots{display:flex; gap:6px; align-items:center}
  .dot{width:8px; height:8px; border-radius:99px; background:#DAD3F2; transition:all .25s}
  .dot.on{width:26px; background:var(--purple)}
  /* ---------- body ---------- */
  .body{padding:22px 26px 28px; flex:1; min-height:470px}
  .row{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:4px 2px 10px; margin-bottom:6px;
  }
  .avatar{flex:none; width:58px; height:58px; border-radius:50%; object-fit:cover}
  .row .txt{font-size:1rem; font-weight:600}
  .row .txt small{display:block; font-weight:500; font-size:.82rem; color:var(--muted); letter-spacing:.02em; margin-top:2px}
  html[dir="rtl"] .row .txt small{letter-spacing:0}
  .label{font-size:.95rem; font-weight:700; margin:20px 0 12px}
  .label span{font-weight:500; color:var(--muted)}
  /* date strip */
  .dates{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none}
  .dates::-webkit-scrollbar{display:none}
  .date{
    flex:none; min-width:66px; padding:12px 6px; text-align:center; cursor:pointer;
    border:1px solid var(--line); border-radius:12px; background:var(--card);
    font-family:inherit; transition:border-color .15s, background .15s;
  }
  .date .dw{font-size:.68rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
  .date .dn{font-size:1.2rem; font-weight:800; margin:3px 0 1px; color:var(--ink)}
  .date .dm{font-size:.7rem; font-weight:500; color:var(--muted)}
  .date:disabled{opacity:.35; cursor:not-allowed}
  .date.sel{border-color:var(--ink); background:var(--gray-pill)}
  .date.sel .dw,.date.sel .dm,.date.sel .dn{color:var(--ink)}
  /* time picker */
  .timewrap{position:relative}
  .timewrap select{
    width:100%; font-family:inherit; font-size:1rem; font-weight:500; color:var(--ink);
    padding:16px 48px 16px 16px; border:1px solid var(--line); border-radius:12px;
    background:var(--card); cursor:pointer;
    -webkit-appearance:none; appearance:none;
  }
  html[dir="rtl"] .timewrap select{padding:16px 16px 16px 48px}
  .timewrap select:focus{outline:2px solid var(--purple); outline-offset:1px; border-color:var(--purple)}
  .timewrap::after{
    content:''; position:absolute; top:50%; inset-inline-end:18px;
    width:10px; height:10px; margin-top:-8px; pointer-events:none;
    border-right:2px solid var(--muted); border-bottom:2px solid var(--muted);
    transform:rotate(45deg);
  }
  .empty{color:var(--muted); font-size:.92rem; padding:18px 2px}
  /* form — floating labels */
  form{display:grid; grid-template-columns:1fr 1fr; gap:30px 28px}
  .field{position:relative; padding-top:20px}
  .field.wide{grid-column:1/-1}
  input{
    width:100%; font-family:inherit; font-size:1.1rem; font-weight:400; color:var(--ink);
    padding:10px 0 12px; border:none; border-bottom:1px solid var(--line); border-radius:0;
    background:transparent;
  }
  input:focus{outline:none; border-bottom:2px solid var(--ink); padding-bottom:11px}
  label{
    position:absolute; inset-inline-start:0; top:30px;
    font-size:1.1rem; font-weight:400; color:var(--muted);
    pointer-events:none; transition:top .18s ease, font-size .18s ease, color .18s ease;
  }
  input:focus ~ label, input:not(:placeholder-shown) ~ label{
    top:0; font-size:.82rem; color:var(--muted);
  }
  .actions{grid-column:1/-1; display:flex; gap:10px; align-items:center; margin-top:8px}
  .btn{
    font-family:inherit; font-size:1rem; font-weight:600; cursor:pointer;
    border:1px solid var(--line); border-radius:12px; padding:16px 26px;
  }
  .btn-primary{background:var(--orange); border-color:var(--orange); color:#fff; flex:1}
  .btn-primary:disabled{opacity:.45; cursor:not-allowed}
  .btn-ghost{background:var(--gray-pill); border-color:var(--gray-pill); color:var(--ink)}
  /* confirmation */
  .done{text-align:center; padding:34px 10px 20px}
  .done h2{font-size:1.4rem; font-weight:800; margin-bottom:8px}
  .done p{color:var(--muted); font-size:.98rem; line-height:1.7; max-width:400px; margin:0 auto 22px}
  /* party animation */
  .party{position:relative; width:110px; height:110px; margin:0 auto 14px}
  .party .pop{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:58px;
    animation:pop .55s cubic-bezier(.2,1.6,.4,1) both, bob 2.4s ease-in-out 1.3s infinite;
  }
  @keyframes pop{0%{transform:scale(0) rotate(-40deg)} 65%{transform:scale(1.3) rotate(10deg)} 100%{transform:scale(1) rotate(0deg)}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-9px) rotate(-6deg)}}
  .party i{
    position:absolute; top:50%; left:50%; width:10px; height:10px; border-radius:2px; opacity:0;
    animation:burst 1s cubic-bezier(.1,.8,.4,1) .12s forwards;
  }
  .party i:nth-child(odd){border-radius:50%; width:8px; height:8px}
  @keyframes burst{
    0%{transform:translate(-50%,-50%) scale(.4) rotate(0deg); opacity:1}
    70%{opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--rot)); opacity:0}
  }
  @media(prefers-reduced-motion:reduce){.party i{display:none}.party .pop{animation:none}}
  .calbtn{
    display:inline-flex; align-items:center; gap:10px;
    border:1px solid var(--line); border-radius:12px; background:var(--card);
    color:var(--ink); text-decoration:none; font-weight:600; font-size:.95rem;
    padding:13px 20px;
  }
  .calbtn svg{color:var(--orange); flex:none}
  .note{margin-top:16px; font-size:.85rem; color:var(--muted)}
  .error{color:var(--bad); font-size:.9rem; font-weight:600; margin-top:12px}
  .loading{color:var(--muted); font-size:.92rem; padding:26px 0; text-align:center}
  .hidden{display:none}
  @media(max-width:560px){
    body{padding:0}
    .card{border-radius:0; min-height:100vh; max-width:none}
    .head{padding:20px 20px 18px}
    .body{padding:20px 20px 30px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="card">
  <header class="head">
    <div class="top">
      <span class="dots"><span class="dot on" id="d1"></span><span class="dot" id="d2"></span><span class="dot" id="d3"></span></span>
    </div>
    <h1 id="headTitle">Book a sales call</h1>
    <div class="sub" id="headSub">Pick a time that works best for you</div>
    <div class="headrow">
      <div class="langs">
        <button type="button" class="lang" data-l="ar" id="btnAr">العربية</button>
        <button type="button" class="lang on" data-l="en" id="btnEn">EN</button>
      </div>
    </div>
  </header>

  <div class="body">
    <!-- STEP 1 -->
    <section id="stepPick">
      <div class="row">
        <div class="txt"><span id="repName">Loading…</span><small id="metaLine">15-minute video call · Google Meet</small></div>
        <img class="avatar" id="repPhoto" alt="">
      </div>

      <div class="label" id="lblDate">Choose a date</div>
      <div class="dates" id="dates"><div class="loading" id="loadingTxt">Loading availability…</div></div>

      <div id="slotArea" class="hidden">
        <div class="label"><span id="lblTime" style="font-weight:700;color:var(--ink)"></span></div>
        <div class="timewrap"><select id="timeSel"></select></div>
      </div>
      <div class="error hidden" id="pickError"></div>
    </section>

    <!-- STEP 2 -->
    <section id="stepForm" class="hidden">
      <form id="form" novalidate>
        <div class="field"><input id="fn" placeholder=" " autocomplete="given-name" required><label for="fn" id="lFn">First name</label></div>
        <div class="field"><input id="ln" placeholder=" " autocomplete="family-name" required><label for="ln" id="lLn">Last name</label></div>
        <div class="field wide"><input id="ph" placeholder=" " type="tel" inputmode="numeric" autocomplete="tel" required><label for="ph" id="lPh">Phone number</label></div>
        <div class="field wide"><input id="em" placeholder=" " type="email" autocomplete="email" required><label for="em" id="lEm">Email</label></div>
        <div class="actions">
          <button type="button" class="btn btn-ghost" id="backBtn">Back</button>
          <button type="submit" class="btn btn-primary" id="submitBtn" disabled>Confirm booking</button>
        </div>
      </form>
      <div class="error hidden" id="formError"></div>
    </section>

    <!-- STEP 3 -->
    <section id="stepDone" class="done hidden">
      <div class="party">
        <i style="--dx:-78px;--dy:-64px;--rot:220deg;background:#F97316"></i>
        <i style="--dx:66px;--dy:-78px;--rot:-190deg;background:#8B5CF6"></i>
        <i style="--dx:-92px;--dy:6px;--rot:160deg;background:#FFC24B"></i>
        <i style="--dx:90px;--dy:-8px;--rot:-240deg;background:#34C77B"></i>
        <i style="--dx:-58px;--dy:70px;--rot:300deg;background:#F471B5"></i>
        <i style="--dx:70px;--dy:62px;--rot:-160deg;background:#F97316"></i>
        <i style="--dx:-20px;--dy:-92px;--rot:120deg;background:#34C77B"></i>
        <i style="--dx:24px;--dy:88px;--rot:-130deg;background:#8B5CF6"></i>
        <i style="--dx:-96px;--dy:-30px;--rot:210deg;background:#F471B5"></i>
        <i style="--dx:98px;--dy:32px;--rot:-200deg;background:#FFC24B"></i>
        <i style="--dx:-36px;--dy:84px;--rot:170deg;background:#1B1B1F"></i>
        <i style="--dx:40px;--dy:-86px;--rot:-140deg;background:#1B1B1F"></i>
        <span class="pop">🎉</span>
      </div>
      <h2 id="doneTitle">Your call is booked</h2>
      <p id="doneText"></p>
      <a class="calbtn" id="calBtn" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        <span id="calTxt">Add to Google Calendar</span>
      </a>
      <p class="note" id="doneNote">A calendar invitation with this link has also been sent to your email.</p>
    </section>

    <section id="fatal" class="done hidden">
      <h2 id="fatalTitle">Scheduling unavailable</h2>
      <p id="fatalText"></p>
    </section>
  </div>
</div>

const REP_PHOTOS = {
  'hazim': REP_PHOTO_DEFAULT
  // add more reps here: 'id': 'data:image/jpeg;base64,...'
};

const rep = new URLSearchParams(location.search).get('rep') || '';
let lang = (new URLSearchParams(location.search).get('lang') === 'ar') ? 'ar' : 'en';
let DATA = null, selDate = null, selSlot = null, step = 1, fatalMsg = null, booked = null;

const $ = id => document.getElementById(id);
const show = (id, on=true) => $(id).classList.toggle('hidden', !on);
const t = () => T[lang];

function fmtDate(iso, opts){
  return new Intl.DateTimeFormat(t().locale + '-u-nu-latn',
    Object.assign({ timeZone: (DATA && DATA.timezone) || 'Asia/Riyadh' }, opts)).format(new Date(iso));
}

function setStep(n){
  step = n;
  ['d1','d2','d3'].forEach((id,i) => $(id).classList.toggle('on', i === n-1));
}

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  $('btnAr').classList.toggle('on', lang === 'ar');
  $('btnEn').classList.toggle('on', lang === 'en');
  const x = t();
  $('lblDate').textContent = x.lblDate;
  $('lblTime').textContent = x.lblTime;
  $('loadingTxt') && ($('loadingTxt').textContent = x.loading);
  $('lFn').textContent = x.fn; $('lLn').textContent = x.ln;
  $('lPh').textContent = x.ph; $('lEm').textContent = x.em;
  $('backBtn').textContent = x.back;
  $('submitBtn').textContent = x.confirm;
  $('calTxt').textContent = x.addCal;
  $('doneTitle').textContent = x.doneTitle;
  $('doneNote').textContent = x.doneNote;
  $('fatalTitle').textContent = x.fatalTitle;
  if (DATA){
    $('repName').textContent = x.callWith + ' ' + DATA.repName;
    $('metaLine').textContent = x.meta(DATA.slotMinutes);
    renderDates();
    if (selDate !== null) renderSlots();
  }
  refreshHead();
  if (fatalMsg) $('fatalText').textContent = fatalMsg[lang] || fatalMsg.en;
  if (booked) $('doneText').textContent =
    x.doneText(DATA.slotMinutes, DATA.repName,
      fmtDate(booked, {weekday:'long', day:'numeric', month:'long', hour:'numeric', minute:'2-digit'}));
}

function refreshHead(){
  const x = t();
  if (step === 1){ $('headTitle').textContent = x.title; $('headSub').textContent = x.sub; }
  else if (step === 2){
    $('headTitle').textContent = x.detailsTitle;
    $('headSub').textContent = selSlot
      ? fmtDate(selSlot.iso, {weekday:'long', day:'numeric', month:'long', hour:'numeric', minute:'2-digit'})
      : x.sub;
  } else { $('headTitle').textContent = x.doneHead; $('headSub').textContent = x.doneSub; }
}

$('btnAr').onclick = () => { lang = 'ar'; applyLang(); };
$('btnEn').onclick = () => { lang = 'en'; applyLang(); };

function fatal(msgEn, msgAr){
  fatalMsg = { en: msgEn, ar: msgAr || msgEn };
  show('stepPick', false); show('stepForm', false); show('stepDone', false);
  $('fatalText').textContent = fatalMsg[lang]; show('fatal', true);
}

/* ---------------- field rules & validation ---------------- */
const PH_PREFIX = '+966 5';
const PH_DIGITS = 8; // Saudi mobile: +966 5XX XXX XXX
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const lettersOnly = s => s.replace(/[^\p{L}\s'’\-]/gu, '');

function phoneRest(){ return $('ph').value.slice(PH_PREFIX.length).replace(/\D/g,''); }

function formValid(){
  return lettersOnly($('fn').value).trim().length > 0 &&
         lettersOnly($('ln').value).trim().length > 0 &&
         phoneRest().length === PH_DIGITS &&
         EMAIL_RE.test($('em').value.trim());
}

function validate(){ $('submitBtn').disabled = !formValid(); }

['fn','ln'].forEach(id => {
  $(id).addEventListener('input', () => {
    const el = $(id), clean = lettersOnly(el.value);
    if (el.value !== clean) el.value = clean;
    validate();
  });
});

$('em').addEventListener('input', () => {
  const el = $('em'), clean = el.value.replace(/\s/g,'');
  if (el.value !== clean) el.value = clean;
  validate();
});

$('ph').addEventListener('focus', () => {
  if (!$('ph').value.startsWith(PH_PREFIX)) $('ph').value = PH_PREFIX;
  requestAnimationFrame(() => {
    const n = $('ph').value.length;
    try { $('ph').setSelectionRange(n, n); } catch(e){}
  });
});

$('ph').addEventListener('input', () => {
  const el = $('ph');
  let v = el.value;
  let rest;
  if (v.startsWith(PH_PREFIX)) {
    rest = v.slice(PH_PREFIX.length);
  } else {
    // prefix was damaged (deleted/edited) — rebuild it and keep only the digits typed
    rest = v.replace(/\D/g,'');
    if (rest.startsWith('966')) rest = rest.slice(3);
    if (rest.startsWith('05')) rest = rest.slice(2);
    else if (rest.startsWith('5')) rest = rest.slice(1);
  }
  rest = rest.replace(/\D/g,'').slice(0, PH_DIGITS);
  const fixed = PH_PREFIX + rest;
  if (el.value !== fixed) el.value = fixed;
  validate();
});

$('ph').addEventListener('blur', () => {
  if ($('ph').value === PH_PREFIX) { $('ph').value = ''; validate(); }
});

// keep the cursor out of the un-deletable prefix
['keydown','click'].forEach(evt => $('ph').addEventListener(evt, () => {
  requestAnimationFrame(() => {
    const el = $('ph');
    if (el.selectionStart !== null && el.selectionStart < PH_PREFIX.length && el.value.startsWith(PH_PREFIX)) {
      try { el.setSelectionRange(PH_PREFIX.length, Math.max(el.selectionEnd, PH_PREFIX.length)); } catch(e){}
    }
  });
}));

async function load(){
  $('repPhoto').src = REP_PHOTOS[rep] || REP_PHOTO_DEFAULT;
  if(!rep) return fatal(T.en.errLink, T.ar.errLink);
  try{
    const r = await fetch(SCRIPT_URL + '?action=availability&rep=' + encodeURIComponent(rep));
    const d = await r.json();
    if(!d.ok) return fatal(d.error || T.en.errNet, T.ar.errNet);
    DATA = d;
    applyLang();
  }catch(e){
    fatal(T.en.errNet, T.ar.errNet);
  }
}

function renderDates(){
  const wrap = $('dates'); wrap.innerHTML = '';
  DATA.days.forEach((day, i) => {
    const b = document.createElement('button');
    b.className = 'date' + (i === selDate ? ' sel' : ''); b.type = 'button';
    b.disabled = day.slots.length === 0;
    const iso = day.date + 'T12:00:00';
    b.innerHTML =
      '<div class="dw">' + fmtDate(iso, {weekday:'short'}) + '</div>' +
      '<div class="dn">' + fmtDate(iso, {day:'numeric'}) + '</div>' +
      '<div class="dm">' + fmtDate(iso, {month:'short'}) + '</div>';
    b.onclick = () => { selDate = i; selSlot = null; renderDates(); renderSlots(); };
    wrap.appendChild(b);
  });
  if(!DATA.days.some(d => d.slots.length)){
    wrap.innerHTML = '<div class="empty">' + t().empty(DATA.days.length) + '</div>';
  }
}

function renderSlots(){
  const sel = $('timeSel'); sel.innerHTML = '';
  const ph = document.createElement('option');
  ph.value = ''; ph.disabled = true; ph.selected = true;
  ph.textContent = t().selectTime;
  sel.appendChild(ph);
  DATA.days[selDate].slots.forEach(s => {
    const o = document.createElement('option');
    o.value = s.iso;
    o.textContent = fmtDate(s.iso, {hour:'numeric', minute:'2-digit'});
    if (selSlot && selSlot.iso === s.iso) { o.selected = true; ph.selected = false; }
    sel.appendChild(o);
  });
  show('slotArea', true);
}

$('timeSel').onchange = () => {
  const iso = $('timeSel').value;
  if (!iso) return;
  selSlot = DATA.days[selDate].slots.find(s => s.iso === iso);
  setStep(2); refreshHead();
  show('stepPick', false); show('stepForm', true);
  validate();
};

$('backBtn').onclick = () => {
  show('stepForm', false); show('stepPick', true);
  selSlot = null;
  if (selDate !== null) renderSlots();
  setStep(1); refreshHead();
};

$('form').onsubmit = async (ev) => {
  ev.preventDefault();
  const x = t();
  const fn = $('fn').value.trim(), ln = $('ln').value.trim(),
        ph = $('ph').value.trim(), em = $('em').value.trim();
  const err = $('formError');
  err.classList.add('hidden');
  if(!fn || !ln || !ph || !em){ err.textContent = x.errFields; err.classList.remove('hidden'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ err.textContent = x.errEmail; err.classList.remove('hidden'); return; }

  const btn = $('submitBtn'); btn.disabled = true; btn.textContent = x.booking;
  try{
    const r = await fetch(SCRIPT_URL, {
      method:'POST',
      body: JSON.stringify({ rep, start: selSlot.iso, firstName: fn, lastName: ln, phone: ph, email: em })
    });
    const d = await r.json();
    if(!d.ok){
      err.textContent = d.error || x.errNet;
      err.classList.remove('hidden');
      btn.disabled = false; btn.textContent = x.confirm;
      if(/just booked/i.test(d.error||'')){
        show('stepForm', false); show('stepPick', true); setStep(1); refreshHead(); load();
      }
      return;
    }
    booked = d.start;
    setStep(3); refreshHead();
    $('doneText').textContent = x.doneText(DATA.slotMinutes, DATA.repName,
      fmtDate(booked, {weekday:'long', day:'numeric', month:'long', hour:'numeric', minute:'2-digit'}));
    const cs = new Date(booked), ce = new Date(cs.getTime() + DATA.slotMinutes * 60000);
    const gfmt = dd => dd.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
    $('calBtn').href = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
      + '&text=' + encodeURIComponent(x.calEvent)
      + '&dates=' + gfmt(cs) + '/' + gfmt(ce)
      + '&details=' + encodeURIComponent('Google Meet: ' + (d.meetLink || ''))
      + '&location=' + encodeURIComponent(d.meetLink || '');
    show('stepForm', false); show('stepDone', true);
  }catch(e){
    err.textContent = x.errNet;
    err.classList.remove('hidden');
    btn.disabled = false; btn.textContent = x.confirm;
  }
};

applyLang();
load();
</script>
</body>
</html>
